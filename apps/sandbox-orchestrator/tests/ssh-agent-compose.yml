services:
  key-seed:
    image: alpine:3.21
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ssh-key-data:/seed
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        cat > /seed/id_ed25519
        chmod 600 /seed/id_ed25519

  agent:
    image: ${SANDBOX_SSH_TEST_IMAGE:?Defina SANDBOX_SSH_TEST_IMAGE}
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SSH_AUTH_SOCK: /run/sandbox-ssh-agent/agent.sock
      SANDBOX_SSH_PRIVATE_KEY_FILE: /run/secrets/sandbox-ssh/id_ed25519
      SANDBOX_SSH_KNOWN_HOSTS_FILE: /etc/sandbox-ssh/known_hosts
      SANDBOX_SSH_ALLOWED_DESTINATIONS: root@163.245.203.201,root@163.245.200.7,root@191.252.181.168,root@191.252.210.83,root@163.245.202.80
    volumes:
      - ssh-key-data:/run/secrets/sandbox-ssh:ro
      - ssh-agent-socket:/run/sandbox-ssh-agent
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    entrypoint: ["/usr/local/bin/start-sandbox-ssh-agent"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/sandbox-ssh-agent-health"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  probe:
    image: ${SANDBOX_SSH_TEST_IMAGE:?Defina SANDBOX_SSH_TEST_IMAGE}
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SSH_AUTH_SOCK: /run/sandbox-ssh-agent/agent.sock
      SANDBOX_SSH_KNOWN_HOSTS_FILE: /etc/sandbox-ssh/known_hosts
      SANDBOX_SSH_PUBLIC_KEY_FILE: /etc/sandbox-ssh/operator_key.pub
      SANDBOX_SSH_ALLOWED_DESTINATIONS: root@163.245.203.201,root@163.245.200.7,root@191.252.181.168,root@191.252.210.83,root@163.245.202.80
    volumes:
      - ssh-agent-socket:/run/sandbox-ssh-agent:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    entrypoint: ["/bin/sh", "-ec"]

volumes:
  ssh-key-data:
  ssh-agent-socket:
