spring:
  datasource:
    url: jdbc:h2:mem:hub-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  liquibase:
    enabled: false

hub:
  github:
    app-id: ""
    installation-id: "0"
    webhook-secret: ""
  mcp:
    api-url: http://localhost:18084/mcp
    api-token: ""
  public-proxy-recovery:
    enabled: false
    repository-owner: paulofor
    repository-name: marketing-hub
    workflow-file: recover-public-proxy.yml
    ref: main
    target-key: kit-whatsapp-pronto-public-proxy
    cooldown-seconds: 600
    status-lookup-limit: 25
